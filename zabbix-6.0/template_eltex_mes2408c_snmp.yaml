zabbix_export:
  version: '6.0'
  date: '2026-10-27T00:00:00Z'
  groups:
    - uuid: c3c6040ce6cb4cfd8a4f0649f7fc28f4
      name: 'Templates/Network devices'
  templates:
    - uuid: 78ed967f90824e088aff465a99b5df3a
      template: 'Eltex MES2408C SNMP'
      name: 'Eltex MES2408C SNMP'
      description: |
        Мониторинг коммутатора Eltex MES2408C по ICMP и SNMP v2c/v3.
        Пинг, порты (admin/oper статус, скорость, трафик), SFP, блоки питания, температура.
        Версия Zabbix: 6.0
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 65c8c7cac14b4f5b80b94cf3441557c3
          name: 'ICMP ping'
          type: SIMPLE
          key: 'icmpping'
          delay: 1m
          history: 7d
          valuemap:
            name: 'Service state'
          triggers:
            - uuid: 0d6bff3cca7c406c860aa75b5c491d22
              expression: 'max(/Eltex MES2408C SNMP/icmpping,#3)=0'
              name: 'Eltex MES2408C: нет ответа на ping ({HOST.NAME})'
              priority: HIGH
        - uuid: e1f068d1ae00443a8d70044ae243f74f
          name: 'ICMP response time'
          type: SIMPLE
          key: 'icmppingsec'
          delay: 1m
          history: 7d
          value_type: FLOAT
          units: 's'
        - uuid: ccfc311c0873432683c82868ff59c9ec
          name: 'ICMP loss'
          type: SIMPLE
          key: 'icmppingloss'
          delay: 1m
          history: 7d
          value_type: FLOAT
          units: '%'
        - uuid: 825eaa2a3b42476083bb048dcc00970b
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.1.1.0'
          key: 'system.descr'
          delay: 1h
          history: 7d
          value_type: TEXT
          trends: '0'
        - uuid: 4855e1ebd5e649d38fad981868731288
          name: 'Uptime'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.1.3.0'
          key: 'system.uptime'
          delay: 1m
          history: 7d
          value_type: FLOAT
          units: 'uptime'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
        - uuid: cddd6baca0504ec18b6ff0932171dcc6
          name: 'Temperature'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.89.53.15.1.10.1'
          key: 'eltex.temp[1]'
          delay: 1m
          history: 7d
          units: '°C'
          triggers:
            - uuid: c17c6a3e964248c68c66bbf2c4aee511
              expression: 'min(/Eltex MES2408C SNMP/eltex.temp[1],5m)>{$MES.TEMP.WARN}'
              name: 'Eltex MES2408C: высокая температура ({ITEM.LASTVALUE1})'
              priority: WARNING
            - uuid: 4b7df663e7e44966807c28ea4eebb0dd
              expression: 'min(/Eltex MES2408C SNMP/eltex.temp[1],5m)>{$MES.TEMP.CRIT}'
              name: 'Eltex MES2408C: критическая температура ({ITEM.LASTVALUE1})'
              priority: HIGH
        - uuid: 02dc8041408a447489d6822d9ce3b9a2
          name: 'Temperature sensor status'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.89.53.15.1.9.1'
          key: 'eltex.temp.status[1]'
          delay: 1m
          history: 7d
          valuemap:
            name: 'Eltex sensor state'
          triggers:
            - uuid: 745cd71e290747478b5e5498513dd065
              expression: 'last(/Eltex MES2408C SNMP/eltex.temp.status[1])>=3'
              name: 'Eltex MES2408C: датчик температуры в состоянии warning/critical'
              priority: HIGH
      discovery_rules:
        - uuid: febc04309c1c4dd7819a80b57303518f
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]'
          key: 'net.if.discovery'
          delay: 1h
          filter:
            conditions:
              - macro: '{#IFDESCR}'
                value: '{$IF.NAME.MATCHES}'
                formulaid: A
          item_prototypes:
            - uuid: 08699785efed42b48f1a22c7540af5c8
              name: 'Port {#IFDESCR}: Admin status (up/down)'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
              key: 'net.if.admin[{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              valuemap:
                name: 'IF admin status'
            - uuid: 70e8aa5374bf49648878f187797b82c6
              name: 'Port {#IFDESCR}: Link state (connected/disconnected)'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.oper[{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              valuemap:
                name: 'IF oper status'
              trigger_prototypes:
                - uuid: 29b9bdb9e19546bc8f0a3b0022b58ac3
                  expression: 'last(/Eltex MES2408C SNMP/net.if.oper[{#SNMPINDEX}])=2 and last(/Eltex MES2408C SNMP/net.if.admin[{#SNMPINDEX}])=1'
                  name: 'Eltex MES2408C: порт {#IFDESCR} - нет линка (disconnected)'
                  priority: WARNING
            - uuid: e658367acbdb48c989ac6270079c5ecf
              name: 'Port {#IFDESCR}: Bandwidth (negotiated speed)'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'net.if.speed[{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              units: 'bps'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
            - uuid: fc3a3f54016641bb85ec6df23eecfb81
              name: 'Port {#IFDESCR}: Incoming traffic'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in[{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              value_type: FLOAT
              units: 'bps'
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
            - uuid: d5760e0253be46ca807554259ae532e5
              name: 'Port {#IFDESCR}: Outgoing traffic'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out[{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              value_type: FLOAT
              units: 'bps'
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
            - uuid: dbaf58c7845540448e496948007ac17c
              name: 'Port {#IFDESCR}: Incoming errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'net.if.in.errors[{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              value_type: FLOAT
              units: 'pps'
              preprocessing:
                - type: CHANGE_PER_SECOND
            - uuid: 7bfb394e42a642098fba9d05245b6d62
              name: 'Port {#IFDESCR}: Outgoing errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'net.if.out.errors[{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              value_type: FLOAT
              units: 'pps'
              preprocessing:
                - type: CHANGE_PER_SECOND
        - uuid: c8ff9d93010d40898647122b9f857467
          name: 'Power supply discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#PSUDESCR},1.3.6.1.4.1.89.83.1.2.1.2]'
          key: 'eltex.psu.discovery'
          delay: 1h
          item_prototypes:
            - uuid: 27bc0d0a21354e248fa447a71bb56ad8
              name: 'PSU {#PSUDESCR}: State'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.89.83.1.2.1.3.{#SNMPINDEX}'
              key: 'eltex.psu.state[{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              valuemap:
                name: 'Eltex sensor state'
              trigger_prototypes:
                - uuid: 31eabc3f5ca249328a048650e5a90d23
                  expression: 'last(/Eltex MES2408C SNMP/eltex.psu.state[{#SNMPINDEX}])>=2 and last(/Eltex MES2408C SNMP/eltex.psu.state[{#SNMPINDEX}])<>5'
                  name: 'Eltex MES2408C: блок питания {#PSUDESCR} неисправен'
                  priority: HIGH
        - uuid: e8a7c00c6f3e43128cedf5c0844f6171
          name: 'SFP modules discovery (ENTITY-MIB)'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SFPDESCR},1.3.6.1.2.1.47.1.1.1.1.2]'
          key: 'eltex.sfp.discovery'
          delay: 1h
          filter:
            conditions:
              - macro: '{#SFPDESCR}'
                value: '{$MES.SFP.MATCHES}'
                formulaid: A
          item_prototypes:
            - uuid: 72a92ae33a784d9c85234e06441a013b
              name: 'SFP {#SFPDESCR}: Model'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.13.{#SNMPINDEX}'
              key: 'eltex.sfp.model[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              value_type: CHAR
              trends: '0'
            - uuid: 82a8ad2bcbcb49ce8163d8743f3a615a
              name: 'SFP {#SFPDESCR}: Serial number'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.11.{#SNMPINDEX}'
              key: 'eltex.sfp.serial[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              value_type: CHAR
              trends: '0'
            - uuid: f817ccd47a0a459f8c8775d61029b7a5
              name: 'SFP {#SFPDESCR}: Vendor'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.12.{#SNMPINDEX}'
              key: 'eltex.sfp.vendor[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              value_type: CHAR
              trends: '0'
      macros:
        - macro: '{$MES.TEMP.WARN}'
          value: '60'
          description: 'Порог температуры Warning, °C'
        - macro: '{$MES.TEMP.CRIT}'
          value: '75'
          description: 'Порог температуры High, °C'
        - macro: '{$IF.NAME.MATCHES}'
          value: '^(gi|fa|te|Port|port|gigabitethernet|GigabitEthernet|oob|tengigabitethernet).*'
          description: 'Фильтр портов для LLD'
        - macro: '{$MES.SFP.MATCHES}'
          value: '(?i)sfp|transceiver'
          description: 'Фильтр SFP-модулей в ENTITY-MIB'
        - macro: '{$SNMP_COMMUNITY}'
          value: 'public'
          description: 'SNMP community'
      valuemaps:
        - uuid: 6651f39e741743228d277e628ac8ecad
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: 'Down'
            - value: '1'
              newvalue: 'Up'
        - uuid: 484c380037534bce8cc50a9f0e541acb
          name: 'IF admin status'
          mappings:
            - value: '1'
              newvalue: 'up'
            - value: '2'
              newvalue: 'down'
            - value: '3'
              newvalue: 'testing'
        - uuid: b0319f733443429a85fa25203e4e85d9
          name: 'IF oper status'
          mappings:
            - value: '1'
              newvalue: 'connected'
            - value: '2'
              newvalue: 'disconnected'
            - value: '3'
              newvalue: 'testing'
            - value: '4'
              newvalue: 'unknown'
            - value: '5'
              newvalue: 'dormant'
            - value: '6'
              newvalue: 'notPresent'
            - value: '7'
              newvalue: 'lowerLayerDown'
        - uuid: d1c416a1a75a4775893d9ee845632522
          name: 'Eltex sensor state'
          mappings:
            - value: '1'
              newvalue: 'normal'
            - value: '2'
              newvalue: 'warning'
            - value: '3'
              newvalue: 'critical'
            - value: '4'
              newvalue: 'shutdown'
            - value: '5'
              newvalue: 'notPresent'
            - value: '6'
              newvalue: 'notFunctioning'
