zabbix_export:
  version: '6.0'
  template_groups:
    - uuid: 262e2f237bc54e029689fb687bce1afd
      name: Templates/Network devices
  templates:
    - uuid: 7cb2d76f31f84be98c65dd83938a45d6
      template: 'Eltex MES2408C by SNMP'
      name: 'Eltex MES2408C by SNMP'
      description: |
        Monitoring of the Eltex MES2408C switch via SNMP (v2c/v3).
        Covers ICMP ping, port state/speed/traffic, SFP modules, power supplies and temperature.
        Set macros {$SNMP_COMMUNITY} on the host. Vendor-specific OIDs (Radlan 1.3.6.1.4.1.89 / Eltex 1.3.6.1.4.1.35265)
        must be verified with snmpwalk on the actual firmware.
      groups:
        - name: Templates/Network devices
      items:
        - uuid: 1a542984b1214056916db6d2785a719e
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          history: 7d
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 951c54312a554ae7b9fec7d31afd3741
              expression: 'max(/Eltex MES2408C by SNMP/icmpping,#3)=0'
              name: 'Eltex MES2408C: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three ICMP checks failed.'
        - uuid: b07abde7a9794984a40a613b89f0e606
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: health
        - uuid: 09294835b2bf4b81b0ded85c358859b0
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: health
        - uuid: 4772ec63874542e8951d5a87e2167f3d
          name: 'SNMP availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: bb2bc75daf414bd3a41bf7ace9b5fbec
              expression: 'max(/Eltex MES2408C by SNMP/zabbix[host,snmp,available],#3)=0'
              name: 'Eltex MES2408C: No SNMP data collection'
              priority: WARNING
        - uuid: b20a77c7929d456c90094c88f4f158d0
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: system.descr
          delay: 1h
          value_type: CHAR
          trends: '0'
          tags:
            - tag: component
              value: system
        - uuid: 8f8907e0813b43ceb27f9ffd152a4e4b
          name: 'System uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: system.uptime
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 6bd193f72f724049bb70637c88e1f35f
          name: 'Device temperature'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.89.53.15.1.10.1
          key: sensor.temp.value
          units: '°C'
          description: 'rlPhdUnitEnvParamTempSensorValue (unit 1).'
          tags:
            - tag: component
              value: temperature
          triggers:
            - uuid: 101102e95c484040a033e59560030eb1
              expression: 'min(/Eltex MES2408C by SNMP/sensor.temp.value,5m)>{$TEMP_WARN}'
              name: 'Eltex MES2408C: High temperature (>{$TEMP_WARN}°C)'
              priority: WARNING
              dependencies:
                - name: 'Eltex MES2408C: Critical temperature (>{$TEMP_CRIT}°C)'
                  expression: 'min(/Eltex MES2408C by SNMP/sensor.temp.value,5m)>{$TEMP_CRIT}'
            - uuid: b604d3bd5ff24565b9cc9e6605372639
              expression: 'min(/Eltex MES2408C by SNMP/sensor.temp.value,5m)>{$TEMP_CRIT}'
              name: 'Eltex MES2408C: Critical temperature (>{$TEMP_CRIT}°C)'
              priority: HIGH
      discovery_rules:
        - uuid: 7f4570196b6f41329e94644bce56d678
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2]'
          key: net.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$IF.NAME.MATCHES}'
                formulaid: A
              - macro: '{#IFNAME}'
                value: '{$IF.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          item_prototypes:
            - uuid: fbb538c68ec8469cbf2af1e49504054c
              name: 'Interface {#IFNAME}: Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[{#SNMPINDEX}]'
              delay: 1m
              description: 'up(1) = connected, down(2) = disconnected'
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              tags:
                - tag: component
                  value: interface
              trigger_prototypes:
                - uuid: 6a444a0dd30e4dcc9251ccb179fa6678
                  expression: 'last(/Eltex MES2408C by SNMP/net.if.status[{#SNMPINDEX}])=2 and last(/Eltex MES2408C by SNMP/net.if.admin[{#SNMPINDEX}])=1'
                  name: 'Eltex MES2408C: Interface {#IFNAME}: Link down'
                  priority: AVERAGE
                  description: 'Port is administratively up but the link is down (disconnected).'
                  manual_close: 'YES'
            - uuid: 482246865c704f869013f39ac0164e6b
              name: 'Interface {#IFNAME}: Administrative status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
              key: 'net.if.admin[{#SNMPINDEX}]'
              delay: 1m
              description: 'up(1) / down(2) as configured'
              valuemap:
                name: 'IF-MIB::ifAdminStatus'
              tags:
                - tag: component
                  value: interface
            - uuid: 6fadaa1b57c7440ca21f0fad5dcf4411
              name: 'Interface {#IFNAME}: Bandwidth (speed)'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'net.if.speed[{#SNMPINDEX}]'
              delay: 1m
              units: 'bps'
              description: 'ifHighSpeed, negotiated speed of the port'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
              tags:
                - tag: component
                  value: interface
            - uuid: e7f4d0cf33994e76b39824a10ce35956
              name: 'Interface {#IFNAME}: Bits received'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in[{#SNMPINDEX}]'
              delay: 1m
              units: 'bps'
              description: 'Incoming traffic rate (ifHCInOctets)'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: interface
            - uuid: 5de6284ef7e047618baf6d92c6c7f62f
              name: 'Interface {#IFNAME}: Bits sent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out[{#SNMPINDEX}]'
              delay: 1m
              units: 'bps'
              description: 'Outgoing traffic rate (ifHCOutOctets)'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: interface
            - uuid: 1b0170e94b1943d79745a4af50506510
              name: 'Interface {#IFNAME}: Inbound errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'net.if.in.errors[{#SNMPINDEX}]'
              delay: 1m
              units: 'pps'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: interface
            - uuid: 6c6c0e83fa194bef9e315747453c4d22
              name: 'Interface {#IFNAME}: Outbound errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'net.if.out.errors[{#SNMPINDEX}]'
              delay: 1m
              units: 'pps'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: interface
            - uuid: 924e2560beb54b0b96cb4558bac4ada7
              name: 'Interface {#IFNAME}: Description (alias)'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.18.{#SNMPINDEX}'
              key: 'net.if.alias[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              trends: '0'
              tags:
                - tag: component
                  value: interface
        - uuid: 0435c8d8dd5f4321b1f69062390a38cc
          name: 'SFP modules discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SFPNAME},1.3.6.1.4.1.35265.1.23.53.1.1.1.8]'
          key: sfp.discovery
          delay: 1h
          description: 'Discovers inserted SFP transceivers (rows exist only for present modules).'
          lifetime: 7d
          item_prototypes:
            - uuid: 7bc9b65aaf164c17a5e124da73705a3a
              name: 'SFP {#SFPNAME}: Vendor'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.35265.1.23.53.1.1.1.8.{#SNMPINDEX}'
              key: 'sfp.vendor[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              trends: '0'
              description: 'Transceiver vendor name (Eltex transceiver info table; verify OID column on firmware)'
              tags:
                - tag: component
                  value: sfp
            - uuid: 49b1c0f687774af38b19fb716e8ca346
              name: 'SFP {#SFPNAME}: Part number / type'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.35265.1.23.53.1.1.1.9.{#SNMPINDEX}'
              key: 'sfp.type[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              trends: '0'
              tags:
                - tag: component
                  value: sfp
            - uuid: 806d2e510a7e47ce9c35b13ea198c323
              name: 'SFP {#SFPNAME}: Serial number'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.35265.1.23.53.1.1.1.10.{#SNMPINDEX}'
              key: 'sfp.serial[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              trends: '0'
              tags:
                - tag: component
                  value: sfp
            - uuid: 501f822884344a8285507e3810c2c4ab
              name: 'SFP {#SFPNAME}: Temperature'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.89.90.1.2.1.3.{#SNMPINDEX}.5'
              key: 'sfp.temp[{#SNMPINDEX}]'
              delay: 1m
              units: '°C'
              description: 'rlPhyTestGetResult, DDM temperature (verify on firmware)'
              tags:
                - tag: component
                  value: sfp
        - uuid: dd73e2dc7b104aa3b4b4afc44aaeb38f
          name: 'Power supply discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#PSUDESCR},1.3.6.1.4.1.89.83.1.2.1.2]'
          key: psu.discovery
          delay: 1h
          item_prototypes:
            - uuid: b32a57d52dd64a0694c160c72d3c5b2c
              name: 'PSU {#PSUDESCR}: State'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.89.83.1.2.1.3.{#SNMPINDEX}'
              key: 'psu.state[{#SNMPINDEX}]'
              delay: 1m
              description: 'rlEnvMonSupplyState: 1 normal, 2 warning, 3 critical, 4 shutdown, 5 notPresent, 6 notFunctioning'
              valuemap:
                name: 'Eltex PSU state'
              tags:
                - tag: component
                  value: power-supply
              trigger_prototypes:
                - uuid: 033f984d0b1e47c888bee3e0505ee0af
                  expression: 'last(/Eltex MES2408C by SNMP/psu.state[{#SNMPINDEX}])>=2 and last(/Eltex MES2408C by SNMP/psu.state[{#SNMPINDEX}])<>5'
                  name: 'Eltex MES2408C: Power supply {#PSUDESCR} is not normal'
                  priority: HIGH
      macros:
        - macro: '{$TEMP_WARN}'
          value: '55'
        - macro: '{$TEMP_CRIT}'
          value: '70'
        - macro: '{$IF.NAME.MATCHES}'
          value: '.*'
        - macro: '{$IF.NAME.NOT_MATCHES}'
          value: '^(vlan|Vlan|oob|Null|CPU).*'
      valuemaps:
        - uuid: b96a8c2dc18f44a5af324ce2284a8e16
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: e9cef3c6dc5e4e2d8d2923f1bf6ad392
          name: 'IF-MIB::ifOperStatus'
          mappings:
            - value: '1'
              newvalue: up
            - value: '2'
              newvalue: down
            - value: '3'
              newvalue: testing
            - value: '5'
              newvalue: dormant
            - value: '6'
              newvalue: notPresent
            - value: '7'
              newvalue: lowerLayerDown
        - uuid: 49ad81f1ab144150b3fcac5544521917
          name: 'IF-MIB::ifAdminStatus'
          mappings:
            - value: '1'
              newvalue: up
            - value: '2'
              newvalue: down
            - value: '3'
              newvalue: testing
        - uuid: 263486772158413fbfc424259f4ac96a
          name: 'Eltex PSU state'
          mappings:
            - value: '1'
              newvalue: normal
            - value: '2'
              newvalue: warning
            - value: '3'
              newvalue: critical
            - value: '4'
              newvalue: shutdown
            - value: '5'
              newvalue: notPresent
            - value: '6'
              newvalue: notFunctioning
