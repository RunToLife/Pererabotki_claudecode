zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: ae622dbf51d7511a9b25ef4472be6268
      name: Templates/Network devices
  templates:
    - uuid: 6e09fcd26a5c58ffac26ea8cd165e22b
      template: 'Eltex MES2408C by SNMP'
      name: 'Eltex MES2408C by SNMP'
      description: |
        Eltex MES2408C: ping, порты, SFP, блоки питания, температура. SNMP v2c/v3.
        Макросы: {$SNMP_COMMUNITY}, {$TEMP_WARN}, {$TEMP_CRIT}.
      template_groups:
        - name: Templates/Network devices
      items:
        - uuid: d6da180030095d70b47c3cc87c4103a2
          name: 'ICMP ping'
          type: SIMPLE
          key: 'icmpping'
          delay: 1m
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: 'network'
          triggers:
            - uuid: 07a887d95be45e31981ea74f079d0567
              expression: 'max(/Eltex MES2408C by SNMP/icmpping,#3)=0'
              name: 'Eltex: нет ответа на ping (host {HOST.NAME})'
              priority: HIGH
        - uuid: 51bcf7834c905b3797a5e84dcf84ad9c
          name: 'ICMP loss'
          type: SIMPLE
          key: 'icmppingloss'
          delay: 1m
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: 'network'
          triggers:
            - uuid: 15f055fb858858ce897d44acc97dce34
              expression: 'min(/Eltex MES2408C by SNMP/icmppingloss,5m)>20 and max(/Eltex MES2408C by SNMP/icmpping,#3)=1'
              name: 'Eltex: потери ICMP > 20%'
              priority: WARNING
        - uuid: da66ec96850a5dc9bd9e5cd5d00280d6
          name: 'ICMP response time'
          type: SIMPLE
          key: 'icmppingsec'
          delay: 1m
          value_type: FLOAT
          units: 's'
          tags:
            - tag: component
              value: 'network'
        - uuid: faec7ac86235590bb452e155dbf1cb71
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.1.1.0'
          key: 'sysDescr'
          delay: 1h
          value_type: CHAR
          tags:
            - tag: component
              value: 'system'
        - uuid: b50bb031d39e597095fece346d8750bf
          name: 'Uptime'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.1.3.0'
          key: 'sysUpTime'
          delay: 1m
          units: 'uptime'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: 'system'
      discovery_rules:
        - uuid: e8a91f9ae0005ab79b5bd8b04e94e76c
          name: 'Port discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]'
          key: 'port.discovery'
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFTYPE}'
                value: '^6$'
                formula: A
          item_prototypes:
            - uuid: 5aa73a690e9b53928f1400ec88af664c
              name: 'Port {#IFNAME}: Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'ifOperStatus[{#SNMPINDEX}]'
              delay: 1m
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              tags:
                - tag: component
                  value: 'port'
                - tag: port
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: 4beb888e9bcf56ff80826b31e53e4bf6
                  expression: 'last(/Eltex MES2408C by SNMP/ifOperStatus[{#SNMPINDEX}])=2 and last(/Eltex MES2408C by SNMP/ifAdminStatus[{#SNMPINDEX}])=1'
                  name: 'Port {#IFNAME} ({#IFALIAS}): link down (host {HOST.NAME})'
                  priority: AVERAGE
            - uuid: ad5d23f6a4f45994b672099d9bd700b3
              name: 'Port {#IFNAME}: Admin status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
              key: 'ifAdminStatus[{#SNMPINDEX}]'
              delay: 1m
              valuemap:
                name: 'IF-MIB::ifAdminStatus'
              tags:
                - tag: component
                  value: 'port'
                - tag: port
                  value: '{#IFNAME}'
            - uuid: 0d6695da45fd59b78463af50ef71f22f
              name: 'Port {#IFNAME}: Connection'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'ifConnection[{#SNMPINDEX}]'
              delay: 1m
              valuemap:
                name: 'Port connection'
              tags:
                - tag: component
                  value: 'port'
                - tag: port
                  value: '{#IFNAME}'
            - uuid: 94a8c3a30f0152bca647e6bd5b98a883
              name: 'Port {#IFNAME}: Bandwidth (speed)'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'ifHighSpeed[{#SNMPINDEX}]'
              delay: 5m
              units: 'bps'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
              tags:
                - tag: component
                  value: 'port'
                - tag: port
                  value: '{#IFNAME}'
            - uuid: 682a8b066eaa5ddc8df348db7eb07d98
              name: 'Port {#IFNAME}: Inbound traffic'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'ifInOctets[{#SNMPINDEX}]'
              delay: 1m
              units: 'bps'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: 'port'
                - tag: port
                  value: '{#IFNAME}'
            - uuid: 2a02399bf8265576ac60a767011f8658
              name: 'Port {#IFNAME}: Outbound traffic'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'ifOutOctets[{#SNMPINDEX}]'
              delay: 1m
              units: 'bps'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: 'port'
                - tag: port
                  value: '{#IFNAME}'
        - uuid: c3466e40a244568e864498d2256e01fc
          name: 'SFP discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SFPNAME},1.3.6.1.2.1.47.1.1.1.1.2,{#SFPMODEL},1.3.6.1.2.1.47.1.1.1.1.13]'
          key: 'sfp.discovery'
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SFPMODEL}'
                value: '.+'
                formula: A
              - macro: '{#SFPNAME}'
                value: '(?i)sfp|transceiver'
                formula: B
          item_prototypes:
            - uuid: 8f10a8e1c2a3543684239c895bc2f489
              name: 'SFP {#SFPNAME}: Model'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.13.{#SNMPINDEX}'
              key: 'sfp.model[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              tags:
                - tag: component
                  value: 'sfp'
            - uuid: d84fe20bc748570a9b089df919a9502f
              name: 'SFP {#SFPNAME}: Vendor'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.12.{#SNMPINDEX}'
              key: 'sfp.vendor[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              tags:
                - tag: component
                  value: 'sfp'
            - uuid: 674c8f37f79f53adaa570ee18151aebc
              name: 'SFP {#SFPNAME}: Serial number'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.11.{#SNMPINDEX}'
              key: 'sfp.serial[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              tags:
                - tag: component
                  value: 'sfp'
        - uuid: 93b0f0f68ae35a0aa3bce60763f30b24
          name: 'PSU discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#PSUNAME},1.3.6.1.4.1.89.83.1.2.1.2]'
          key: 'psu.discovery'
          delay: 1h
          item_prototypes:
            - uuid: 9eafc0bf3ba05e34b321ff37eac176d3
              name: 'PSU {#PSUNAME}: Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.89.83.1.2.1.3.{#SNMPINDEX}'
              key: 'psu.status[{#SNMPINDEX}]'
              delay: 1m
              valuemap:
                name: 'Eltex PSU/Fan state'
              tags:
                - tag: component
                  value: 'psu'
              trigger_prototypes:
                - uuid: 9c92ddc6abb55d248fec7c402e84abb7
                  expression: 'last(/Eltex MES2408C by SNMP/psu.status[{#SNMPINDEX}])>=3 and last(/Eltex MES2408C by SNMP/psu.status[{#SNMPINDEX}])<=6'
                  name: 'PSU {#PSUNAME}: неисправен (host {HOST.NAME})'
                  priority: HIGH
        - uuid: 4a9a2bcd310d58b9a0733eca3b85cfe2
          name: 'Temperature discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SENSOR},1.3.6.1.4.1.89.53.15.1.10]'
          key: 'temp.discovery'
          delay: 1h
          item_prototypes:
            - uuid: ad1a108eb9e459cdab9c29a7ed99f225
              name: 'Temperature sensor {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.89.53.15.1.10.{#SNMPINDEX}'
              key: 'sensor.temp[{#SNMPINDEX}]'
              delay: 1m
              units: '°C'
              tags:
                - tag: component
                  value: 'temperature'
              trigger_prototypes:
                - uuid: 3962f2ea1c6457ac8830d0a796128198
                  expression: 'min(/Eltex MES2408C by SNMP/sensor.temp[{#SNMPINDEX}],5m)>{$TEMP_WARN}'
                  name: 'Температура {#SNMPINDEX} выше {$TEMP_WARN}°C'
                  priority: WARNING
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/Eltex MES2408C by SNMP/sensor.temp[{#SNMPINDEX}],5m)<{$TEMP_WARN}-3'
                - uuid: 17a9999ff3205816a05224f775590f14
                  expression: 'min(/Eltex MES2408C by SNMP/sensor.temp[{#SNMPINDEX}],5m)>{$TEMP_CRIT}'
                  name: 'Температура {#SNMPINDEX} выше {$TEMP_CRIT}°C'
                  priority: HIGH
      macros:
        - macro: '{$TEMP_WARN}'
          value: '60'
        - macro: '{$TEMP_CRIT}'
          value: '75'
      valuemaps:
        - uuid: 364ff4cbae3d5351b315d07f44d4fd09
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: 'Down'
            - value: '1'
              newvalue: 'Up'
        - uuid: 37376204a2e6592eb547ab103e324b7e
          name: 'IF-MIB::ifOperStatus'
          mappings:
            - value: '1'
              newvalue: 'up'
            - value: '2'
              newvalue: 'down'
            - value: '3'
              newvalue: 'testing'
            - value: '4'
              newvalue: 'unknown'
            - value: '5'
              newvalue: 'dormant'
            - value: '6'
              newvalue: 'notPresent'
            - value: '7'
              newvalue: 'lowerLayerDown'
        - uuid: 9d55651a143f59eea2eac81405a0d71f
          name: 'IF-MIB::ifAdminStatus'
          mappings:
            - value: '1'
              newvalue: 'up'
            - value: '2'
              newvalue: 'down'
            - value: '3'
              newvalue: 'testing'
        - uuid: 8e1e8650531d55c6bac5b8c0d911e258
          name: 'Port connection'
          mappings:
            - value: '1'
              newvalue: 'connected'
            - value: '2'
              newvalue: 'disconnected'
            - value: '3'
              newvalue: 'disconnected'
            - value: '4'
              newvalue: 'disconnected'
            - value: '5'
              newvalue: 'disconnected'
            - value: '6'
              newvalue: 'disconnected'
            - value: '7'
              newvalue: 'disconnected'
        - uuid: f1efa7f581655ad78af23d1e7e1a501a
          name: 'Eltex PSU/Fan state'
          mappings:
            - value: '1'
              newvalue: 'normal'
            - value: '2'
              newvalue: 'warning'
            - value: '3'
              newvalue: 'critical'
            - value: '4'
              newvalue: 'shutdown'
            - value: '5'
              newvalue: 'notPresent'
            - value: '6'
              newvalue: 'notFunctioning'
