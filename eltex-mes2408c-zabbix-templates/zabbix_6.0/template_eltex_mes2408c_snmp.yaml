zabbix_export:
  version: "6.0"
  template_groups:
    - uuid: 728744fb247a45ff8bf3b161afb1746d
      name: Templates/Network devices
  templates:
    - uuid: f05eb4bbfa1444d98ca428e3c088670d
      template: "Template Eltex MES2408C SNMP"
      name: "Template Eltex MES2408C SNMP"
      description: |
        Мониторинг коммутатора Eltex MES2408C по SNMP (v2c).
        Ping, порты (up/down, скорость, трафик), SFP, блоки питания, температура.
        Макросы: {$SNMP_COMMUNITY}, {$TEMP_WARN}, {$TEMP_CRIT}, {$ICMP_LOSS_WARN}, {$ICMP_RESPONSE_TIME_WARN}.
      groups:
        - name: Templates/Network devices
      items:
      - uuid: 1cc943633d8847b58dc6ca988723f111
        name: 'ICMP ping'
        type: SIMPLE
        key: icmpping
        history: 7d
        valuemap:
          name: 'Service state'
        tags:
          - tag: component
            value: network
      - uuid: 14c8415656dd418188542ae8237c72ae
        name: 'ICMP loss'
        type: SIMPLE
        key: icmppingloss
        value_type: FLOAT
        units: '%'
        history: 7d
        tags:
          - tag: component
            value: network
      - uuid: 7608c3fbe92d4e0d890c7aa604132b56
        name: 'ICMP response time'
        type: SIMPLE
        key: icmppingsec
        value_type: FLOAT
        units: s
        history: 7d
        tags:
          - tag: component
            value: network
      - uuid: 8d762cabbf3a4ba1844a5fecd259ba5a
        name: "Model / description"
        type: SNMP_AGENT
        snmp_oid: "1.3.6.1.2.1.1.1.0"
        key: "system.descr"
        delay: 1h
        history: 30d
        value_type: TEXT
        trends: '0'
        tags:
          - tag: component
            value: "system"
      - uuid: 86ce554f0ab14ea282ee36c896753bd6
        name: "Uptime"
        type: SNMP_AGENT
        snmp_oid: "1.3.6.1.2.1.1.3.0"
        key: "system.uptime"
        delay: 1m
        history: 7d
        units: "uptime"
        preprocessing:
          - type: MULTIPLIER
            parameters:
              - "0.01"
        tags:
          - tag: component
            value: "system"
      - uuid: 61fed1450f5441fb8bd44423f578b727
        name: "Temperature"
        type: SNMP_AGENT
        snmp_oid: "1.3.6.1.4.1.89.53.15.1.10.1"
        key: "temp.sensor"
        delay: 1m
        history: 7d
        units: "°C"
        tags:
          - tag: component
            value: "temperature"
      discovery_rules:
      - uuid: 9a9160e48d994e958f571d69a07669f3
        name: 'Network interfaces discovery'
        type: SNMP_AGENT
        snmp_oid: 'discovery[{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]'
        key: if.discovery
        delay: 1h
        filter:
          conditions:
            - macro: '{#IFTYPE}'
              value: '^6$'
              formulaid: A
        item_prototypes:
          - uuid: b60a4c78bd3d432a8a306614df5ec137
            name: "Port {#IFNAME}: Operational status (up/down, connected)"
            type: SNMP_AGENT
            snmp_oid: "1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}"
            key: "if.oper[{#SNMPINDEX}]"
            delay: 1m
            history: 7d
            valuemap:
              name: "IF-MIB::ifOperStatus"
            tags:
              - tag: component
                value: "network"
          - uuid: a81d7cb259794a9c89c28d621849930a
            name: "Port {#IFNAME}: Admin status"
            type: SNMP_AGENT
            snmp_oid: "1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}"
            key: "if.admin[{#SNMPINDEX}]"
            delay: 5m
            history: 7d
            valuemap:
              name: "IF-MIB::ifAdminStatus"
            tags:
              - tag: component
                value: "network"
          - uuid: a1c33f0c0ef84acb887573ff46bd653a
            name: "Port {#IFNAME}: Bandwidth (negotiated speed)"
            type: SNMP_AGENT
            snmp_oid: "1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}"
            key: "if.speed[{#SNMPINDEX}]"
            delay: 5m
            history: 7d
            units: "bps"
            preprocessing:
              - type: MULTIPLIER
                parameters:
                  - "1000000"
            tags:
              - tag: component
                value: "network"
          - uuid: eadd265cd0a54efb85177e053b14ffc5
            name: "Port {#IFNAME}: Inbound traffic"
            type: SNMP_AGENT
            snmp_oid: "1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}"
            key: "if.in[{#SNMPINDEX}]"
            delay: 1m
            history: 7d
            units: "bps"
            preprocessing:
              - type: CHANGE_PER_SECOND
                parameters:
                  - ""
              - type: MULTIPLIER
                parameters:
                  - "8"
            tags:
              - tag: component
                value: "network"
          - uuid: e849adc6e3e54ddf871bec8373a241cf
            name: "Port {#IFNAME}: Outbound traffic"
            type: SNMP_AGENT
            snmp_oid: "1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}"
            key: "if.out[{#SNMPINDEX}]"
            delay: 1m
            history: 7d
            units: "bps"
            preprocessing:
              - type: CHANGE_PER_SECOND
                parameters:
                  - ""
              - type: MULTIPLIER
                parameters:
                  - "8"
            tags:
              - tag: component
                value: "network"
          - uuid: a0a3484303834c158273ec170b2f07d4
            name: "Port {#IFNAME}: Inbound errors"
            type: SNMP_AGENT
            snmp_oid: "1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}"
            key: "if.inerr[{#SNMPINDEX}]"
            delay: 1m
            history: 7d
            units: "pps"
            preprocessing:
              - type: CHANGE_PER_SECOND
                parameters:
                  - ""
            tags:
              - tag: component
                value: "network"
          - uuid: a652fefe774a4e3e8b5faa73e195b87b
            name: "Port {#IFNAME}: Outbound errors"
            type: SNMP_AGENT
            snmp_oid: "1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}"
            key: "if.outerr[{#SNMPINDEX}]"
            delay: 1m
            history: 7d
            units: "pps"
            preprocessing:
              - type: CHANGE_PER_SECOND
                parameters:
                  - ""
            tags:
              - tag: component
                value: "network"
          - uuid: fbd91e4f7782433982a4ccc12184b8b1
            name: "Port {#IFNAME}: Alias"
            type: SNMP_AGENT
            snmp_oid: "1.3.6.1.2.1.31.1.1.1.18.{#SNMPINDEX}"
            key: "if.alias[{#SNMPINDEX}]"
            delay: 1h
            history: 30d
            value_type: CHAR
            trends: '0'
            tags:
              - tag: component
                value: "network"
        trigger_prototypes:
          - uuid: 7c55289beaf846718fb6024ccc2693a4
            expression: "last(/Template Eltex MES2408C SNMP/if.oper[{#SNMPINDEX}])=2 and last(/Template Eltex MES2408C SNMP/if.admin[{#SNMPINDEX}])=1"
            name: "Port {#IFNAME}: Link is down"
            priority: AVERAGE
      - uuid: a55b87e90188430a8eec7041a427f10f
        name: 'SFP modules discovery'
        type: SNMP_AGENT
        snmp_oid: 'discovery[{#SFPNAME},1.3.6.1.2.1.47.1.1.1.1.7,{#SFPCLASS},1.3.6.1.2.1.47.1.1.1.1.5]'
        key: sfp.discovery
        delay: 1h
        description: 'Порты ENTITY-MIB класса port(10); у портов с вставленным SFP заполнено entPhysicalModelName/SerialNum.'
        filter:
          conditions:
            - macro: '{#SFPCLASS}'
              value: '^10$'
              formulaid: A
        item_prototypes:
          - uuid: 8412424984d24df58a330c9a47de9457
            name: "SFP {#SFPNAME}: Module model"
            type: SNMP_AGENT
            snmp_oid: "1.3.6.1.2.1.47.1.1.1.1.13.{#SNMPINDEX}"
            key: "sfp.model[{#SNMPINDEX}]"
            delay: 1h
            history: 30d
            value_type: CHAR
            trends: '0'
            tags:
              - tag: component
                value: "sfp"
          - uuid: ccd2e81d8cce4cc8817122d32b1673c0
            name: "SFP {#SFPNAME}: Vendor"
            type: SNMP_AGENT
            snmp_oid: "1.3.6.1.2.1.47.1.1.1.1.12.{#SNMPINDEX}"
            key: "sfp.vendor[{#SNMPINDEX}]"
            delay: 1h
            history: 30d
            value_type: CHAR
            trends: '0'
            tags:
              - tag: component
                value: "sfp"
          - uuid: 3bf2dcfd9bf843108647cc7f8a514257
            name: "SFP {#SFPNAME}: Serial number"
            type: SNMP_AGENT
            snmp_oid: "1.3.6.1.2.1.47.1.1.1.1.11.{#SNMPINDEX}"
            key: "sfp.serial[{#SNMPINDEX}]"
            delay: 1h
            history: 30d
            value_type: CHAR
            trends: '0'
            tags:
              - tag: component
                value: "sfp"
          - uuid: 38b08ae5c2ac420889b073843a394532
            name: "SFP {#SFPNAME}: Description (type)"
            type: SNMP_AGENT
            snmp_oid: "1.3.6.1.2.1.47.1.1.1.1.2.{#SNMPINDEX}"
            key: "sfp.descr[{#SNMPINDEX}]"
            delay: 1h
            history: 30d
            value_type: CHAR
            trends: '0'
            tags:
              - tag: component
                value: "sfp"
      - uuid: 493ed8eb5a964a0b841e4692f6e29edc
        name: 'Power supply discovery'
        type: SNMP_AGENT
        snmp_oid: 'discovery[{#PSUNAME},1.3.6.1.4.1.89.83.1.2.1.2]'
        key: psu.discovery
        delay: 1h
        item_prototypes:
          - uuid: f3d7eb8b1e9e45ff804a01cb7538977e
            name: "PSU {#PSUNAME}: State"
            type: SNMP_AGENT
            snmp_oid: "1.3.6.1.4.1.89.83.1.2.1.3.{#SNMPINDEX}"
            key: "psu.state[{#SNMPINDEX}]"
            delay: 1m
            history: 7d
            valuemap:
              name: "Eltex::PowerSupplyState"
            tags:
              - tag: component
                value: "power"
        trigger_prototypes:
          - uuid: 4ea0a9e4474d4db58b0182d7b2e40862
            expression: "last(/Template Eltex MES2408C SNMP/psu.state[{#SNMPINDEX}])<>1 and last(/Template Eltex MES2408C SNMP/psu.state[{#SNMPINDEX}])<>5"
            name: "PSU {#PSUNAME}: Not normal"
            priority: HIGH
      triggers:
        - uuid: 14efc7dfbe9443f385fa497a584246a4
          expression: "max(/Template Eltex MES2408C SNMP/icmpping,#3)=0"
          name: "Eltex MES2408C: Unavailable by ICMP ping"
          priority: HIGH
        - uuid: 112520b00b114bf88f46d481f2f299b2
          expression: "min(/Template Eltex MES2408C SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN}"
          name: "Eltex MES2408C: High ICMP loss"
          priority: WARNING
        - uuid: d9c58f72483a4cee878480d924d48934
          expression: "avg(/Template Eltex MES2408C SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}"
          name: "Eltex MES2408C: High ICMP response time"
          priority: WARNING
        - uuid: 43137eedfc454e7c87677dd907d47ebf
          expression: "min(/Template Eltex MES2408C SNMP/temp.sensor,5m)>{$TEMP_WARN}"
          name: "Eltex MES2408C: High temperature (warning)"
          priority: WARNING
        - uuid: 87831f2a0af0484e8b88d3a3f31c0b67
          expression: "min(/Template Eltex MES2408C SNMP/temp.sensor,5m)>{$TEMP_CRIT}"
          name: "Eltex MES2408C: High temperature (critical)"
          priority: HIGH
        - uuid: e2f1f12936ba45348382925e9676b25d
          expression: "last(/Template Eltex MES2408C SNMP/system.uptime)<10m"
          name: "Eltex MES2408C: Device restarted"
          priority: INFO
      macros:
        - macro: '{$SNMP_COMMUNITY}'
          value: public
        - macro: '{$TEMP_WARN}'
          value: '60'
        - macro: '{$TEMP_CRIT}'
          value: '75'
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
  valuemaps:
    - uuid: 3f34cc4cc3774bd7841a2e25fd339b55
      name: "IF-MIB::ifOperStatus"
      mappings:
        - value: "1"
          newvalue: "up (connected)"
        - value: "2"
          newvalue: "down (disconnected)"
        - value: "3"
          newvalue: "testing"
        - value: "4"
          newvalue: "unknown"
        - value: "5"
          newvalue: "dormant"
        - value: "6"
          newvalue: "notPresent"
        - value: "7"
          newvalue: "lowerLayerDown"
    - uuid: 9090c26f776b43cc8976070df241627f
      name: "IF-MIB::ifAdminStatus"
      mappings:
        - value: "1"
          newvalue: "enabled (up)"
        - value: "2"
          newvalue: "disabled (down)"
        - value: "3"
          newvalue: "testing"
    - uuid: 948e0d64ce304c0a8a8e8c942b4d5d57
      name: "Eltex::PowerSupplyState"
      mappings:
        - value: "1"
          newvalue: "normal"
        - value: "2"
          newvalue: "warning"
        - value: "3"
          newvalue: "critical"
        - value: "4"
          newvalue: "shutdown"
        - value: "5"
          newvalue: "notPresent"
        - value: "6"
          newvalue: "notFunctioning"
    - uuid: d267a32633aa44578019dd8651c459e5
      name: 'Service state'
      mappings:
        - value: '0'
          newvalue: Down
        - value: '1'
          newvalue: Up
