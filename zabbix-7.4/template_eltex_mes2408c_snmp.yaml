zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: c7fa751168365fb7b9f30f5fb8daefeb
      name: Templates/Network devices
  templates:
    - uuid: a080b7aae0a052c4aeeb456314f6c3c5
      template: 'Eltex MES2408C SNMP'
      name: 'Eltex MES2408C SNMP'
      description: 'Ping, порты, SFP, блоки питания, температура. Макрос {$SNMP_COMMUNITY}.'
      groups:
        - name: Templates/Network devices
      items:
        - uuid: 898945b27dd55e0ea4d6a66b34b0c735
          name: 'ICMP ping'
          type: SIMPLE
          key: 'icmpping'
          delay: 30s
          value_type: UNSIGNED
          tags:
            - tag: component
              value: network
        - uuid: 26cba2189ec95be4bb25b0e3ee41c4e0
          name: 'ICMP packet loss'
          type: SIMPLE
          key: 'icmppingloss'
          delay: 1m
          units: '%'
          tags:
            - tag: component
              value: network
        - uuid: 103177846c475337acf28725767411ab
          name: 'ICMP response time'
          type: SIMPLE
          key: 'icmppingsec'
          delay: 1m
          units: 's'
          tags:
            - tag: component
              value: network
        - uuid: 175f31da011f545282c691bc3cb9b309
          name: 'SNMP availability'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.1.5.0'
          key: 'eltex.snmp.sysname'
          delay: 1m
          value_type: CHAR
          tags:
            - tag: component
              value: system
      discovery_rules:
        - uuid: 3c2739be01ae55e388c8277e59062537
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFDESCR}, 1.3.6.1.2.1.2.2.1.2, {#IFTYPE}, 1.3.6.1.2.1.2.2.1.3, {#IFALIAS}, 1.3.6.1.2.1.31.1.1.1.18]'
          key: 'eltex.if.discovery'
          delay: 1h
          lifetime: 7d
          filter:
            evaltype: AND_OR
            conditions:
              - macro: '{#IFTYPE}'
                value: '^6$'
                formulaid: A
          item_prototypes:
            - uuid: 5af6de6d3c9a5f089ccba8f7d0c73c17
              name: 'Port {#IFDESCR}: operational status (up/down, connected/disconnected)'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'eltex.if.oper[{#SNMPINDEX}]'
              delay: 1m
              value_type: UNSIGNED
              tags:
                - tag: component
                  value: port
            - uuid: 7f81b0e8b2e25b50a9020a032f785109
              name: 'Port {#IFDESCR}: admin status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
              key: 'eltex.if.admin[{#SNMPINDEX}]'
              delay: 1m
              value_type: UNSIGNED
              tags:
                - tag: component
                  value: port
            - uuid: b4ac16b2935c5c838153056c375aae88
              name: 'Port {#IFDESCR}: bandwidth (link speed)'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'eltex.if.speed[{#SNMPINDEX}]'
              delay: 1m
              value_type: UNSIGNED
              units: 'bps'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
              tags:
                - tag: component
                  value: port
            - uuid: 61bdab5b0a635eb7acf7994dd453ef54
              name: 'Port {#IFDESCR}: incoming traffic'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'eltex.if.in[{#SNMPINDEX}]'
              delay: 1m
              units: 'bps'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: port
            - uuid: c811425c18da54aa92221143795acb01
              name: 'Port {#IFDESCR}: outgoing traffic'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'eltex.if.out[{#SNMPINDEX}]'
              delay: 1m
              units: 'bps'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: port
          trigger_prototypes:
            - uuid: a9bb4ab3fa5151e386f86af9a600ca3f
              expression: 'last(/Eltex MES2408C SNMP/eltex.if.oper[{#SNMPINDEX}])=2 and last(/Eltex MES2408C SNMP/eltex.if.admin[{#SNMPINDEX}])=1'
              name: 'Port {#IFDESCR}: link down'
              priority: WARNING
        - uuid: 4629eda06700597f97af563dbfa1cb73
          name: 'Power supply discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#PSUIDX}, 1.3.6.1.4.1.89.53.15.1.2]'
          key: 'eltex.psu.discovery'
          delay: 1h
          lifetime: 7d
          item_prototypes:
            - uuid: 55f28b3152975d8998e1fd9742e6f4aa
              name: 'PSU {#SNMPINDEX}: main power supply status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.89.53.15.1.2.{#SNMPINDEX}'
              key: 'eltex.psu.main[{#SNMPINDEX}]'
              delay: 1m
              value_type: UNSIGNED
              tags:
                - tag: component
                  value: power
            - uuid: 722a10cbc50750f992e1bb8c3ba9b61b
              name: 'PSU {#SNMPINDEX}: redundant power supply status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.89.53.15.1.3.{#SNMPINDEX}'
              key: 'eltex.psu.red[{#SNMPINDEX}]'
              delay: 1m
              value_type: UNSIGNED
              tags:
                - tag: component
                  value: power
          trigger_prototypes:
            - uuid: 7d82cb2e02dd51bcac6460e17f1151dd
              expression: 'last(/Eltex MES2408C SNMP/eltex.psu.main[{#SNMPINDEX}])>=3 and last(/Eltex MES2408C SNMP/eltex.psu.main[{#SNMPINDEX}])<>5'
              name: 'PSU {#SNMPINDEX}: main power supply failure'
              priority: HIGH
              description: '1 normal, 2 warning, 3 critical, 4 shutdown, 5 notPresent, 6 notFunctioning'
        - uuid: 9e6f801bac815bcf9287423a0dfa6059
          name: 'Temperature sensor discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#TEMPIDX}, 1.3.6.1.4.1.89.53.15.1.10]'
          key: 'eltex.temp.discovery'
          delay: 1h
          lifetime: 7d
          item_prototypes:
            - uuid: 11c4cb2d950b57d08c559c3d89e1444c
              name: 'Unit {#SNMPINDEX}: temperature'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.89.53.15.1.10.{#SNMPINDEX}'
              key: 'eltex.temp[{#SNMPINDEX}]'
              delay: 1m
              units: 'C'
              tags:
                - tag: component
                  value: temperature
            - uuid: a75edfbe3c265deebd8daa0b1f1d3b49
              name: 'Unit {#SNMPINDEX}: temperature sensor status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.89.53.15.1.9.{#SNMPINDEX}'
              key: 'eltex.temp.status[{#SNMPINDEX}]'
              delay: 1m
              value_type: UNSIGNED
              tags:
                - tag: component
                  value: temperature
          trigger_prototypes:
            - uuid: c82de0d2b644586689b38f281c5c196b
              expression: 'avg(/Eltex MES2408C SNMP/eltex.temp[{#SNMPINDEX}],5m)>{$TEMP_WARN}'
              name: 'Unit {#SNMPINDEX}: high temperature (>{$TEMP_WARN}C)'
              priority: WARNING
        - uuid: 04159f8068e25ae5b87b3a5a470de256
          name: 'SFP transceiver discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SFPIDX}, 1.3.6.1.4.1.89.90.1.2.1.3]'
          key: 'eltex.sfp.discovery'
          delay: 1h
          lifetime: 7d
          item_prototypes:
            - uuid: 345cfbb7377a582bac9dd515e61d0a62
              name: 'SFP {#SNMPINDEX}: type'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.89.90.1.2.1.3.{#SNMPINDEX}'
              key: 'eltex.sfp.type[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              tags:
                - tag: component
                  value: sfp
            - uuid: eb4d019e7d0c56f2a21f4f5157faf908
              name: 'SFP {#SNMPINDEX}: vendor'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.89.90.1.2.1.4.{#SNMPINDEX}'
              key: 'eltex.sfp.vendor[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              tags:
                - tag: component
                  value: sfp
            - uuid: d8b5d4a659425ae7a9b699a26e1c8dfc
              name: 'SFP {#SNMPINDEX}: part number'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.89.90.1.2.1.5.{#SNMPINDEX}'
              key: 'eltex.sfp.pn[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              tags:
                - tag: component
                  value: sfp
            - uuid: b22e8bb6f8a35488a27d2f1b78abf701
              name: 'SFP {#SNMPINDEX}: serial number'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.89.90.1.2.1.6.{#SNMPINDEX}'
              key: 'eltex.sfp.sn[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              tags:
                - tag: component
                  value: sfp
      triggers:
        - uuid: 57161591df4055d98364f8eb2d835bbe
          expression: 'max(/Eltex MES2408C SNMP/icmpping,#3)=0'
          name: 'Eltex MES2408C: no ping'
          priority: HIGH
      macros:
        - macro: '{$SNMP_COMMUNITY}'
          value: public
        - macro: '{$TEMP_WARN}'
          value: '65'
